<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/favicon.svg" sizes="any" />
    <link rel="icon" type="image/x-icon" href="/assets/branding/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/webp" href="/assets/branding/antigravity-logo.webp" sizes="276x276" />
    <link rel="apple-touch-icon" href="/assets/branding/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/assets/branding/site.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rocket Companion</title>
    <style>
      /* 0ms Critical Startup Shell */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #09090b;
        color: #f4f4f5;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Zero-JS Graceful Intercept -->
    <noscript>
      <div style="position:fixed;inset:0;background:#09090b;color:#f87171;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:99999;font-family:ui-monospace,SFMono-Regular,monospace;">
        <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
        <h2 style="font-size:18px;font-weight:800;margin:0 0 8px 0;color:#ffffff;">JavaScript Required</h2>
        <p style="font-size:13px;color:#94a3b8;max-width:480px;line-height:1.6;margin:0;">
          Rocket Companion is a client-side WebAssembly game engine. Please enable JavaScript in your browser settings to continue.
        </p>
      </div>
    </noscript>

    <div id="app"></div>

    <script>
      /* Preflight Client Environment Detection */
      (function() {
        try {
          var canvas = document.createElement('canvas');
          var gl = canvas.getContext('webgl2');
          if (!gl) {
            console.warn('[Preflight] WebGL2 is not supported on this context');
          }
          if (typeof Storage !== 'undefined') {
            localStorage.setItem('__cs_test', '1');
            localStorage.removeItem('__cs_test');
          }
        } catch(e) {
          console.warn('[Preflight] Storage or WebGL diagnostic warning:', e);
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
