<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RocketCompanion MVP-1 — Rust Core + Split-Screen Validation</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #mvp1-bar {
        height: 32px;
        line-height: 32px;
        padding: 0 12px;
        background: #0f172a;
        border-bottom: 1px solid #1e293b;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #mvp1-split {
        display: flex;
        width: 100%;
        height: calc(100% - 32px);
      }
      .pane {
        position: relative;
        flex: 1;
        height: 100%;
        border-right: 1px solid #1e293b;
      }
      .pane:last-child {
        border-right: none;
      }
      .pane-label {
        position: absolute;
        top: 8px;
        left: 10px;
        padding: 2px 8px;
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
        z-index: 2;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="mvp1-bar">
      <span id="mvp1-status">Initializing rc_core.wasm...</span>
    </div>
    <div id="mvp1-split">
      <div class="pane">
        <div class="pane-label">HOST (120Hz Direct ArrayBuffer)</div>
        <canvas id="canvas-host"></canvas>
      </div>
      <div class="pane">
        <div class="pane-label">CLIENT SIM (60Hz + 5~25ms Jitter)</div>
        <canvas id="canvas-client"></canvas>
      </div>
    </div>
    <script type="module" src="/src/mvp1/main.ts"></script>
  </body>
</html>
