[package]
name = "rc_tauri_shell"
version = "1.0.0"
description = "Rocket Companion — Native Desktop Tauri Shell"
authors = ["Mark"]
license = ""
repository = "https://github.com/Antigravi-ty/RocketCompanion"
edition = "2024"
rust-version = "1.90"


[lib]
name = "rc_tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-macos-fps = "0.1"
igd-next = "0.18.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
wtransport = { version = "0.6", features = ["self-signed"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Networking_NetworkListManager", "Win32_System_Com", "Win32_Foundation"] }


