[package]
name = "rc_tauri_shell"
version = "1.0.0"
description = "Rocket Companion — Native Desktop Tauri Shell"
authors = ["Mark"]
license = ""
repository = "https://github.com/Antigravi-ty/RocketCompanion"
edition = "2024"
rust-version = "1.90"


[lib]
name = "rc_tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-macos-fps = "0.1"

